services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-masking-app
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # nginx in front sets X-Forwarded-For; the app must only trust it behind the proxy.
      TRUST_PROXY_HEADERS: "true"
    expose:
      - "3000"
    volumes:
      - app_output:/app/output

  nginx:
    image: nginx:1.27-alpine
    container_name: doc-masking-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/certs:/etc/nginx/certs:ro

volumes:
  app_output:
    name: doc_masking_output
