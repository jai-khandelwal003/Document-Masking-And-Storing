name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan tracked files for secrets and private data
        run: python tools/scan_secrets.py --all

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system packages
        # tesseract: OCR; libmagic1: file-type sniffing; libgl1/libglib2.0-0: OpenCV; libzbar0: pyzbar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libmagic1 libgl1 libglib2.0-0 libzbar0

      - name: Install Python dependencies
        # The optional QR/ML stack (torch and friends, several GB) is not needed by the tests:
        # QR masking is skipped gracefully when qreader is missing.
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(torch|torchvision|ultralytics|ultralytics-thop|qreader|qrdet|quadrilateral-fitter)==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests
